{% extends "layout.html" %}

{% block title %}
    Log in
{% endblock %}


{% block main %}
    <!-- Log in page-->
    <form action="/login" method="post">
        <!-- Collect username-->
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto body-font" name="username" placeholder="Username" type="text" required>
        </div>
        <!-- Collect password-->
        <div class="mb-3">
            <input class="form-control mx-auto w-auto body-font" name="password" placeholder="Password" type="password" required>
        </div>
        <!-- Submit form-->
        <button class="btn btn-primary body-font" type="submit">Log In</button>
    </form>
{% endblock %}
