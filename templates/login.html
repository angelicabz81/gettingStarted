{% extends "layout.html" %}

{% block title %}
    Log in
{% endblock %}


{% block main %}
    <form action="/login" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto body-font" name="username" placeholder="Username" type="text">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto body-font" name="password" placeholder="Password" type="password">
        </div>
        <button class="btn btn-primary body-font" type="submit">Log In</button>
    </form>
{% endblock %}
