{% extends "layout.html" %}

{% block title %}
    Holdings
{% endblock %}


{% block main %}
    <table class = "table table-striped">
        <thead>
            <tr>
                <th class = "text-start">Size</th>
                <th class = "text-end">Color</th>
                <th class = "text-end">Image</th>
            </tr>
        </thead>

        <tbody>
            {% for dress in holdings %}
                <tr>
                    <td class = "text-start"> {{ dress["size"] }}</td>
                    <td class = "text-end"> {{ dress["color"]}}</td>
                    <td class = "text-end"> <img src = "{{ dress['image_url'] }}" ></td>
                    
                    <td>
                        <form action = "/returnDress" method = "post">
                            <input type="hidden" name="dressId" value="{{ dress['id'] }}">
                            <button class="btn btn-primary" type="submit">Return dress</button>
                        </form>
                    </td>
                 </tr>

              {% endfor %}
        </tbody>
    </table>
{% endblock %}
