<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- Loads Bootstrap-->
        <!-- http://getbootstrap.com/docs/5.3/ -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>


        <!-- Sets tab icon to dress -->
        <link href="/static/icon.png" rel="icon">

        <!-- Loads CSS For styling-->
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">

        <title>Pocket Quince {% block title %}{% endblock %}</title>

        <!-- Import Google Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Dancing+Script:wght@400..700&family=Imperial+Script&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>

    <body>

        <!-- Navigation bar that links to all pages, sourced from CS50 Finance Source Code-->
        <nav class=" border navbar navbar-expand-md">
            <div class="container-fluid">
                <a id = "navTitle" class="navbar-brand imperial"  href="/"><span>Pocket Quince!</span></a>
                <button aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler" data-bs-target="#navbar" data-bs-toggle="collapse" type="button">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbar">
                    {% if session["user_id"] %} 
                        <!-- Navbar links after logging in-->
                        <ul class="navbar-nav me-auto mt-2">
                            <li class="nav-item body-font"><a class="nav-link" href="/catalog">Dresses</a></li>
                            <li class="nav-item body-font"><a class="nav-link" href="/holdings">My holdings</a></li>
                            <li class="nav-item body-font"><a class="nav-link" href="/upload">Upload dress</a></li>
                            <li class="nav-item body-font"><a class="nav-link" href="/messages">Inbox</a></li>
                        </ul>

                        <!-- Log out page on far right-->
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item body-font"><a class="nav-link" href="/logout">Log Out</a></li>
                        </ul>
                    {% else %}
                        <!-- Navbar links before logging in-->
                        <ul class="navbar-nav ms-auto mt-2">
                            <li class="nav-item body-font"><a class="nav-link" href="/register">Register</a></li>
                            <li class="nav-item body-font"><a class="nav-link" href="/login">Log In</a></li>
                        </ul>
                    {% endif %}
                </div>
            </div>
        </nav>

        <!-- Shows flash messages as alert boxes-->
        {% if get_flashed_messages() %}
            <header>
                <div class="alert alert-primary mb-0 text-center" role="alert">
                    {{ get_flashed_messages() | join(" ") }}
                </div>
            </header>
        {% endif %}

        <!-- Placeholder for each page-->
        <main class="container py-5 text-center">
            {% block main %}{% endblock %}
        </main>

        <!-- Builds full HTML of current page-->
        <footer class="mb-5">
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    // Adapted from https://stackoverflow.com/a/10162353
                    const html = '<!DOCTYPE ' +
                    document.doctype.name +
                    (document.doctype.publicId ? ' PUBLIC "' + document.doctype.publicId + '"' : '') +
                    (!document.doctype.publicId && document.doctype.systemId ? ' SYSTEM' : '') +
                    (document.doctype.systemId ? ' "' + document.doctype.systemId + '"' : '') +
                    '>\n' + document.documentElement.outerHTML;
                    document.querySelector('form[action="https://validator.w3.org/check"] > input[name="fragment"]').value = html;
                });
            </script>
        </footer>

    </body>

</html>
